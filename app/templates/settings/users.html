{% extends 'base.html' %}
{% block content %}
<section class="card two-col">
  <div>
    <h2>Neuer Benutzer</h2>
    <form method="post" class="grid-form">
      {{ form.hidden_tag() }}
      <label>{{ form.username.label }}{{ form.username(class_='input') }}</label>
      <label>{{ form.password.label }}{{ form.password(class_='input') }}</label>
      <label>{{ form.role.label }}{{ form.role(class_='input') }}</label>
      {{ form.submit(class_='btn btn-primary') }}
    </form>
  </div>
  <div>
    <h2>Bestehende Benutzer</h2>
    <table class="table"><tr><th>Name</th><th>Rolle</th></tr>{% for u in users %}<tr><td>{{ u.username }}</td><td>{{ u.role }}</td></tr>{% endfor %}</table>
  </div>
</section>
{% endblock %}
