{% extends 'base.html' %}
{% block title %}Settings · {{ section_meta.title }}{% endblock %}
{% block content %}
<section class="card settings-page">
  <header class="settings-page-header">
    <h2>{{ section_meta.title }}</h2>
    <p class="muted">{{ section_meta.description }}</p>
  </header>

  <form method="post" class="settings-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% for field in section_meta.fields %}
      <label class="settings-field">
        <span>{{ field.label }}</span>
        {% if field.type == 'checkbox' %}
          <input type="checkbox" name="{{ field.key }}" {% if settings_map.get(field.key, '0') == '1' %}checked{% endif %}>
        {% elif field.type == 'select' %}
          <select class="input" name="{{ field.key }}">
            {% for option in field.options %}
              <option value="{{ option.value }}" {% if settings_map.get(field.key, '') == option.value %}selected{% endif %}>{{ option.label }}</option>
            {% endfor %}
          </select>
        {% else %}
          <input
            class="input"
            type="text"
            name="{{ field.key }}"
            value="{{ settings_map.get(field.key, '') }}"
            placeholder="{{ field.placeholder }}"
          >
        {% endif %}
      </label>
    {% endfor %}
    <div class="panel-footer">
      <button class="btn btn-primary" type="submit">Speichern</button>
    </div>
  </form>
</section>
{% endblock %}
